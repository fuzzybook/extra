<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 80" width="700" height="80">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a10" />
      <stop offset="45%" stop-color="#141124" />
      <stop offset="100%" stop-color="#0e1826" />
    </linearGradient>

    <!-- Neon Glow Gradient (Magenta to Cyan) -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00a0" />
      <stop offset="50%" stop-color="#bf5af2" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0080" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>

    <!-- Subtle Radial Glow behind CTA -->
    <radialGradient id="glowRight" cx="85%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Radial Glow on Left -->
    <radialGradient id="glowLeft" cx="15%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ff00a0" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff00a0" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00a0" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Drop Shadow Filter for CTA Button -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ff00a0" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="0.5" y="0.5" width="699" height="79" rx="8" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1" />

  <!-- Background Glows -->
  <rect x="1" y="1" width="698" height="78" rx="7" fill="url(#glowLeft)" />
  <rect x="1" y="1" width="698" height="78" rx="7" fill="url(#glowRight)" />

  <!-- Decorative Tech Grid / Diagonal Accents -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="0.75">
    <line x1="20" y1="0" x2="100" y2="80" />
    <line x1="45" y1="0" x2="125" y2="80" />
    <line x1="70" y1="0" x2="150" y2="80" />
    <line x1="560" y1="0" x2="640" y2="80" />
    <line x1="585" y1="0" x2="665" y2="80" />
  </g>

  <!-- Top Accent Bar -->
  <rect x="24" y="0" width="160" height="2" fill="url(#neonGrad)" />
  <rect x="520" y="78" width="140" height="2" fill="url(#neonGrad)" />

  <!-- Left Icon / Badge -->
  <g transform="translate(24, 18)">
    <!-- Badge Background -->
    <rect x="0" y="0" width="108" height="20" rx="10" fill="#1f1833" stroke="url(#neonGrad)" stroke-width="1" />
    <!-- Pulse dot -->
    <circle cx="12" cy="10" r="4" fill="#ff00a0" />
    <circle cx="12" cy="10" r="2" fill="#ffffff" />
    <!-- Badge Text -->
    <text x="24" y="14" fill="#f0e6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1">PREMIUM LIVE</text>
  </g>

  <!-- Main Headline -->
  <text x="24" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="0.5">
    EXCLUSIVE CHANNELS &amp; SHOWS
  </text>

  <!-- Center / Subtitle details -->
  <g transform="translate(345, 26)">
    <text x="0" y="14" fill="#00d2ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">
      ★ ULTRA HD STREAMING
    </text>
    <text x="0" y="32" fill="#a0a5ba" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500">
      Private Lounges • Verified Performers
    </text>
  </g>

  <!-- Vertical Divider -->
  <line x1="330" y1="18" x2="330" y2="62" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

  <!-- Right CTA Button -->
  <g transform="translate(535, 20)">
    <!-- Button Shadow & Shape -->
    <rect x="0" y="0" width="142" height="40" rx="20" fill="url(#btnGrad)" filter="url(#shadow)" />
    <!-- Inner Highlight -->
    <rect x="1" y="1" width="140" height="19" rx="19" fill="#ffffff" fill-opacity="0.15" />
    <!-- Button Text -->
    <text x="64" y="25" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="0.8">
      EXPLORE NOW
    </text>
    <!-- Arrow Icon -->
    <path d="M 112 20 L 118 20 M 115 16 L 119 20 L 115 24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
