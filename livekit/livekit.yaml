port: 7880
bind_addresses:
  - ""
rtc:
  node_ip: "127.0.0.1"
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: false
keys:
  devkey: secret
logging:
  json: false
  level: info
# Webhook verso il backend Encore locale (porta 4002, come QCLI_API_BASE_URL dei
# dev server): aggiorna la tabella videochat.live_status con lo stato delle
# stanze. Firmato con la chiave qui sopra, la stessa del backend.
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:4002/videochat/livekit/webhook
